name: claimsforce
description: claimsforce GmbH is a Hamburg-based insurtech building AI-powered software for property
  and casualty claims management and underwriting. Its platform helps insurers, loss-adjusting and
  expert organizations, and independent adjusters digitize the end-to-end claims process - automating
  report and calculation generation, enabling video-based remote case assessment, optimizing adjuster
  disposition and route planning to cut travel time, and surfacing real-time analytics for claims
  handling and risk management. Named customers include Zurich Gruppe Deutschland, HanseMerkur,
  Concordia, Crawford, Sedgwick and Die Regulierer. The product is a private, login-only SaaS with no
  public API or developer portal as of July 2026. The company is ISO/IEC 27001:2022 certified (TUV
  Rheinland) and backed by Point Nine.
